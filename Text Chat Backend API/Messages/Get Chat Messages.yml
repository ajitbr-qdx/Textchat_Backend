info:
  name: Get Chat Messages
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/chats/{{chatId}}/messages?page=1&limit=50"
  params:
    - name: page
      value: "1"
      type: query
    - name: limit
      value: "50"
      type: query
  auth:
    type: bearer
    token: "{{authToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Get paginated message history for a specific chat.
