opencollection: 1.0.0

info:
  name: Text Chat Backend API

request:
  variables:
    - name: baseUrl
      value: http://localhost:5000
    - name: authToken
      value: ""
    - name: chatId
      value: "1"
    - name: recipientId
      value: "2"

docs:
  content: Postman collection for Text Chat Backend API with auto-authenticating scripts, user management, 1-on-1 chats, and messages.
  type: text/markdown
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
