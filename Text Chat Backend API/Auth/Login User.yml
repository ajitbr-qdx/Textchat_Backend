info:
  name: Login User
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/api/auth/login"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "email": "alice@example.com",
        "password": "Password123"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: "if (res.getStatus() === 200) {\r

        \    var json = res.getBody();\r

        \    if (json.data && json.data.token) {\r

        \        bru.setVar('authToken', json.data.token);\r

        \        console.log('authToken automatically saved');\r

        \    }\r

        }"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Authenticate user and get JWT token.
